interface:
  display_name: "Понимание задачи"
  short_description: "Превращает материалы клиента в согласованную задачу"
  default_prompt: "Используй $task-understanding, чтобы прояснить внешнюю клиентскую задачу и вести живой файл; после каждого входа покажи проблемы по разделам, сначала блокирующие, затем оставшиеся значимые вопросы заказчику."

policy:
